<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF9F6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111310" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Aurora Radio — a 24/7 global internet radio station. One live stream, worldwide."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Aurora Radio — 24/7 Global Live Radio</title>
    <script>
      // Apply persisted theme before first paint to avoid flash.
      (function () {
        try {
          var t = localStorage.getItem('aurora.theme')
          if (t === 'dark' || t === 'light') {
            document.documentElement.classList.toggle('dark', t === 'dark')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
