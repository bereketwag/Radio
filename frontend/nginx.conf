server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API → Django
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE: no buffering, long read timeout
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Uploaded media → Django
    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Live audio → Icecast (same-origin for the browser, no CORS needed)
    location /live/ {
        proxy_pass http://icecast:8000/;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_http_version 1.1;
        # NOTE: do NOT request Icy-Metadata here — it interleaves metadata
        # blocks into the MP3 byte stream (icy-metaint) that the HTML5 audio
        # element never asked for and can fail to decode. Now-playing
        # metadata comes from Django's SSE/polling endpoint instead.
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
